{% extends "base.html" %}
{% block title %}Sign out · AgriPulse{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign out</h1>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <button type="submit">Sign out of AgriPulse</button>
  </form>
</div>
{% endblock %}
