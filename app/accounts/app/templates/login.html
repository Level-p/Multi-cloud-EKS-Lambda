{% extends "base.html" %}
{% block title %}Sign in · AgriPulse{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>E-mail <input name="email" type="email" required maxlength="254" autocomplete="username"></label>
    <label>Password <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">New here? <a href="/register?role=buyer&amp;next={{ next|urlencode }}">Register to buy</a> or
    <a href="/register?role=farmer&amp;next={{ next|urlencode }}">register your farm</a>.</p>
</div>
{% endblock %}
