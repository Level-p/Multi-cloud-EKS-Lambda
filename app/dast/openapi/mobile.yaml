openapi: 3.0.3
# AgriPulse mobile API (CloudFront -> API Gateway REST -> the gateway Lambda -> the services).
# Keep in step with ROUTES in app/mobile-backend/agripulse_mobile/api.py. The services check the bearer token.
info:
  title: AgriPulse mobile API
  version: "2.0"
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties: { email: { type: string, example: dast@example.com }, password: { type: string, example: dast-password-1 } }
    Order:
      type: object
      required: [items, delivery_address, phone]
      properties:
        items: { type: array, items: { type: object, properties: { listing_id: { type: integer, example: 1 }, quantity: { type: number, example: 1 } } } }
        delivery_address: { type: string, example: "1 DAST Road, Ibadan" }
        phone: { type: string, example: "+234 800 000 0000" }
    Any:
      type: object
      additionalProperties: true
paths:
  /health:
    get: { security: [], responses: { "200": { description: alive } } }
  /auth/register:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "201": { description: account and token } }
  /auth/token:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses: { "200": { description: token } }
  /me:
    get: { responses: { "200": { description: the caller } } }
  /catalog:
    get:
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, example: tomato } }
        - { name: kind, in: query, schema: { type: string, enum: [produce, resource] } }
      responses: { "200": { description: what is for sale } }
  /items/{id}:
    get: { security: [], parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: one item } } }
  /orders:
    get: { responses: { "200": { description: my orders } } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
      responses: { "201": { description: one order per farm } }
  /orders/{id}/cancel:
    post: { parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: cancelled } } }
  /sales:
    get: { responses: { "200": { description: orders for my farm } } }
  /sales/{id}/status:
    post:
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "200": { description: new status } }
  /farm/profile:
    get: { responses: { "200": { description: my farm } } }
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "200": { description: saved } }
  /farm/listings:
    get: { responses: { "200": { description: my listings } } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "201": { description: listed } }
  /farm/listings/{id}:
    patch:
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "200": { description: changed } }
    delete: { parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "204": { description: hidden } } }
  /farm/listings/{id}/photo:
    post: { parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { description: pre-signed upload } } }
  /farm/activities:
    get: { responses: { "200": { description: my farm records } } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Any" } } } }
      responses: { "201": { description: recorded } }
