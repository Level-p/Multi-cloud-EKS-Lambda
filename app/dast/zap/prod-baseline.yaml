# OWASP ZAP Automation Framework plan: BASELINE (passive, unauthenticated) scan of a deployed
# AgriPulse endpoint, after the deployment stage:
#   the services     https://<service>.<zone>: ALB + AWS WAF -> EKS (accounts, farm, shop, incidents)
#   mobile-backend   https://api.<zone>: API Gateway + AWS WAF -> the gateway Lambda
# Nothing is attacked and nothing is written. It proves what only the real edge can show: TLS and HTTPS redirects,
# security headers through the ALB, the sign-in redirect and the session cookie's flags, that protected routes
# answer 401/303 instead of data, CORS, error pages and server banners. An authenticated production scan would need
# a dedicated test account and an exclusion of write operations: see app/dast/README.md.
#
# Inputs: TARGET_URL, APP, DAST_DIR
env:
  contexts:
    - name: agripulse-prod
      urls: ["${TARGET_URL}"]
      includePaths: ["${TARGET_URL}.*"]
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: agripulse-prod
      maxDuration: 2
      maxDepth: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-json
      reportDir: "${DAST_DIR}/reports"
      reportFile: zap-report.json
    risks: [info, low, medium, high]
  - type: report
    parameters:
      template: sarif-json
      reportDir: "${DAST_DIR}/reports"
      reportFile: zap-report.sarif.json
    risks: [low, medium, high]
  - type: report
    parameters:
      template: traditional-html
      reportDir: "${DAST_DIR}/reports"
      reportFile: zap-report.html
      reportTitle: "AgriPulse ${APP}: DAST baseline (production)"
    risks: [info, low, medium, high]
