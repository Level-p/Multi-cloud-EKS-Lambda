# DAST with OWASP ZAP.
#   mode: ephemeral   start the service on the runner (throwaway data, real signed tokens), FULL scan: passive + active
#                     attacks against every OpenAPI operation and every form          (gate)
#   mode: production  BASELINE scan (passive, unauthenticated) of the deployed endpoint (gate)
# The gates block only when input blocking is "true" (repository variable SECURITY_GATES = enforce); otherwise
# the scans still run, reports are still uploaded, and findings become warnings.
# Results: the summary on the run page, and the artifact zap-<app>-<mode> (HTML report, SARIF, JSON, JUnit).
# The gate is app/dast/zap_gate.py with app/dast/zap-policy.json (reviewed, expiring exceptions).
name: OWASP ZAP DAST
description: Full scan of the app on the runner, or baseline scan of production
inputs:
  app:
    description: accounts | farm | shop | incidents | mobile-backend
    required: true
  mode:
    description: ephemeral | production
    required: true
  target-url:
    description: "production: the public URL"
    default: ""
  blocking:
    description: "true: findings fail the run; false: report only (warnings). Workflows pass vars.SECURITY_GATES == 'enforce'"
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.mode == 'ephemeral'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - if: inputs.mode == 'ephemeral'
      name: DAST gate self-test
      id: selftest
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      run: python -m pip install --quiet pytest==9.1.1 && python -m pytest -q app/dast/tests

    - if: inputs.mode == 'ephemeral' && inputs.app != 'mobile-backend'
      name: Start ${{ inputs.app }} (uvicorn, SQLite, real signed tokens)
      id: start_app
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: bash app/dast/start-service.sh "$APP"

    - if: inputs.mode == 'ephemeral' && inputs.app != 'mobile-backend'
      name: OWASP ZAP full scan + gate
      id: zap_full
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: bash app/dast/run-zap.sh ci-full "$APP" http://localhost:8080 "$APP.json"

    - if: inputs.mode == 'ephemeral' && inputs.app == 'mobile-backend'
      name: Start the mobile backend (API Gateway stand-in, echo services)
      id: start_mobile
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/dast-logs
        PYTHONPATH=app/mobile-backend nohup python app/dast/mobile_local.py > /tmp/dast-logs/mobile.log 2>&1 &
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/health > /dev/null && break; sleep 2; done
        echo "::add-mask::dast-mobile-token"
        echo "DAST_TOKEN=dast-mobile-token" >> "$GITHUB_ENV"   # the stand-in services only check that a token is sent

    - if: inputs.mode == 'ephemeral' && inputs.app == 'mobile-backend'
      name: OWASP ZAP full scan + gate
      id: zap_full_mobile
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      run: bash app/dast/run-zap.sh ci-full mobile-backend http://localhost:8090 mobile.yaml

    - if: always() && inputs.mode == 'ephemeral'
      name: No unhandled errors in the app log
      id: app_log
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      run: |
        # Application errors only: uvicorn's "Exception in ASGI application", the services' loggers at
        # ERROR (agripulse.*). uvicorn/h11 noise about deliberately malformed requests (TLS sent to a
        # plain-HTTP port, bad request lines) is not an app bug.
        if grep -hE 'Exception in ASGI application|"level":"ERROR","logger":"agripulse' /tmp/dast-logs/*.log; then
          echo "::error::The app raised errors while being scanned (see above)."; exit 1
        fi

    - if: inputs.mode == 'production'
      name: OWASP ZAP baseline scan (production) + gate
      id: zap_baseline
      continue-on-error: ${{ inputs.blocking != 'true' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        URL: ${{ inputs.target-url }}
      run: |
        set -euo pipefail
        if [ -z "$URL" ]; then echo "::error::No public URL: has the infrastructure workflow run (terraform output)?"; exit 1; fi
        bash app/dast/run-zap.sh prod-baseline "$APP" "$URL"

    - if: always() && inputs.blocking != 'true'
      name: Findings (report only)
      shell: bash
      env:
        OUTCOMES: >-
          self-test:${{ steps.selftest.outcome }} app-start:${{ steps.start_app.outcome }}
          app-start:${{ steps.start_mobile.outcome }} zap-full:${{ steps.zap_full.outcome }}
          zap-full:${{ steps.zap_full_mobile.outcome }} app-log:${{ steps.app_log.outcome }}
          zap-baseline:${{ steps.zap_baseline.outcome }}
      run: |
        for scan in $OUTCOMES; do
          if [ "${scan#*:}" = "failure" ]; then
            echo "::warning title=ZAP ${scan%%:*} (report only)::findings do not fail the run while SECURITY_GATES is not 'enforce'; see the step log and the zap-* artifact."
            echo "- ZAP ${scan%%:*}: findings (report only, see the zap-* artifact)" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: zap-${{ inputs.app }}-${{ inputs.mode }}-${{ github.run_attempt }}
        path: app/dast/reports
        if-no-files-found: ignore
        retention-days: 30
