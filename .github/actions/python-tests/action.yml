# Unit tests with the exact, hash-verified dependencies
name: Python tests
description: pytest for one app, results as an artifact
inputs:
  app-path:
    description: Folder of the app (requirements.txt, requirements-dev.in, tests/)
    required: true
  python-path:
    description: Extra PYTHONPATH (e.g. src)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Unit tests (${{ inputs.app-path }})
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        PYTHONPATH: ${{ inputs.python-path }}
      run: |
        python -m pip install --quiet --require-hashes -r requirements.txt
        python -m pip install --quiet -r requirements-dev.in
        python -m pytest -q --junitxml=test-results.xml

    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ github.job }}
        path: ${{ inputs.app-path }}/test-results.xml
        if-no-files-found: ignore
        retention-days: 14
