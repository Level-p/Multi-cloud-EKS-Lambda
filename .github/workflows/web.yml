# AgriPulse web -> EKS (Argo Rollouts canary with Prometheus analysis). Stages: _container-app.yml
name: web

on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "gitops/charts/agripulse-web/**"
      - "app/dast/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/_container-app.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths: ["app/web/**", "gitops/charts/agripulse-web/**", "app/dast/**"]
  workflow_dispatch:

permissions:
  contents: write   # the gitops job commits the new image tag
  id-token: write   # OIDC token for AWS
  actions: read     # the AI diagnosis reads the failed jobs' logs
  checks: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/_container-app.yml
    secrets: inherit
    with:
      app: web
      chart: gitops/charts/agripulse-web
      workload: rollout/agripulse-web
      namespace: agripulse
      url-env: TF_OUT_WEB_URL
