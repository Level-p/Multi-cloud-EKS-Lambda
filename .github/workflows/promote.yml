# ---------------------------------------------------------------------------
# AgriPulse: promote what runs in staging to production (GitOps, continuous delivery)
#
# Run it by hand (Actions > promote > Run workflow), pick one service or "all".
#   1. waits for approval: the environment agripulse-production has required reviewers
#   2. copies the image (tag + digest) from gitops/services/<service>/staging.yaml into production.yaml,
#      commits and pushes. Services never built (placeholder "initial") or already in production are skipped
#   3. Argo CD then shows <service>-production as OutOfSync: a person reviews the diff and clicks SYNC
#      (production never syncs by itself; staging does)
#
# The SAME signed image staging ran: nothing is rebuilt. Roll back: git revert the promotion commit, push, SYNC.
# ---------------------------------------------------------------------------
name: promote

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to promote to production
        type: choice
        options: [all, accounts, farm, shop, incidents]
        default: all

permissions:
  contents: write   # push the production.yaml commit

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Copy staging images to production
    runs-on: ubuntu-latest
    environment:
      name: agripulse-production   # required reviewers: Settings > Environments
      url: https://argocd.mfon21.space
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Copy the images
        env:
          CHOICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
          if [ "$CHOICE" = "all" ]; then services="accounts farm shop incidents"; else services="$CHOICE"; fi
          echo "### Promotion" >> "$GITHUB_STEP_SUMMARY"
          for s in $services; do
            STAGE="gitops/services/$s/staging.yaml"; PROD="gitops/services/$s/production.yaml"
            TAG=$(yq '.image.tag' "$STAGE"); DIGEST=$(yq '.image.digest // ""' "$STAGE")
            if [ "$TAG" = "initial" ] || [ -z "$DIGEST" ]; then
              echo "- $s: skipped, never built (run the app workflow first)" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            if [ "$(yq '.image.tag' "$PROD")" = "$TAG" ]; then
              echo "- $s: production already has $TAG" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            TAG="$TAG" DIGEST="$DIGEST" yq -i '.image.tag = strenv(TAG) | .image.digest = strenv(DIGEST)' "$PROD"
            echo "- $s: **$TAG**" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo "### Changes for production"
            echo '```diff'
            git diff -- gitops/services/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/services/*/production.yaml
          if git diff --cached --quiet; then
            echo "Production already has the staging versions." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NAMES=$(git diff --cached --name-only | cut -d/ -f3 | paste -sd, -)
          git commit -m "ci: promote $NAMES from staging to production (run $GITHUB_RUN_NUMBER) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$attempt" = 5 ] && { echo "::error::Could not push the promotion"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "Production values updated. Open Argo CD (https://argocd.mfon21.space), review each **<service>-production** (APP DIFF) and click **SYNC**." >> "$GITHUB_STEP_SUMMARY"
