# AgriPulse incidents: the operations team's incident blog, reported to Slack -> EKS, staging then production
# (Argo Rollouts canary with Prometheus analysis in both). Stages: _service.yml
name: incidents

on:
  push:
    branches: [main]
    paths:
      - "app/incidents/**"
      - "app/common/**"
      - "app/Dockerfile"
      - "app/dast/**"
      - "gitops/charts/agripulse-service/**"
      - "gitops/services/incidents/values.yaml"
      - ".github/workflows/incidents.yml"
      - ".github/workflows/_service.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths: ["app/incidents/**", "app/common/**", "app/Dockerfile", "app/dast/**", "gitops/charts/agripulse-service/**", "gitops/services/incidents/values.yaml"]
  workflow_dispatch:

permissions:
  contents: write   # the deploy jobs commit the new image to gitops/services/incidents/
  id-token: write   # OIDC token for AWS
  actions: read     # the AI diagnosis reads the failed jobs' logs
  checks: read

concurrency:
  group: incidents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    secrets: inherit
    with:
      service: incidents
