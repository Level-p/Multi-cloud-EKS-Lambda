# ---------------------------------------------------------------------------
# Platform inside EKS (infra/platform): AWS Load Balancer Controller, Secrets Store CSI (AWS), Prometheus +
# Grafana + Alertmanager, OpenTelemetry Collector + Tempo + Loki, Argo CD (+ the two apps), Argo Rollouts, Kyverno
#   Pull request  -> security scans + terraform plan
#   Push to main  -> the same, then apply EXACTLY that plan after approval (environment agripulse-infrastructure)
# Second of two stacks: needs infra-aws applied (it reads that state). Composed of infra/modules/k8s-*.
# Sign-in: GitHub OIDC -> IAM role only. Helm/Kubernetes reach EKS with "aws eks get-token" (EKS access entry).
# ---------------------------------------------------------------------------
name: platform

on:
  push:
    branches: [main]
    paths: ["infra/platform/**", "infra/modules/k8s-*/**", ".github/workflows/platform.yml", ".github/scripts/tf_preflight.py"]
  pull_request:
    branches: [main]
    paths: ["infra/platform/**", "infra/modules/k8s-*/**", ".github/workflows/platform.yml", ".github/scripts/tf_preflight.py"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token for AWS

concurrency:
  group: platform
  cancel-in-progress: false   # never cancel a running apply

env:
  AWS_REGION: eu-west-2
  TF_DIR: infra/platform
  TF_VERSION: 1.15.6
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Gitleaks scans the history

      - uses: ./.github/actions/security-scans
        with:
          iac-paths: infra/platform infra/modules
          blocking: ${{ vars.SECURITY_GATES == 'enforce' }}   # report only unless the repository variable says enforce

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The preflight (.github/scripts/tf_preflight.py) is tested before it is trusted
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preflight tools
        run: |
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python -m pytest -q .github/scripts/test_tf_preflight.py

      # kubectl/helm for the preflight: what already exists in the cluster (adopted, or flagged)
      - uses: ./.github/actions/infra-outputs
        with:
          stack: aws

      - name: Cluster access (read-only use in this job)
        run: aws eks update-kubeconfig --name "$TF_OUT_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null

      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          # Argo CD watches THIS repository (nothing hard-coded); a private repository needs GIT_REPO_TOKEN
          TF_VAR_git_repo_url: ${{ github.server_url }}/${{ github.repository }}.git
          TF_VAR_git_repo_token: ${{ secrets.GIT_REPO_TOKEN }}
          TF_VAR_price_admins: ${{ vars.PRICE_ADMINS != '' && vars.PRICE_ADMINS || '[]' }}   # e.g. ["you@example.com"]
        run: |
          terraform init -input=false
          terraform fmt -check -recursive . ../modules
          terraform validate
          terraform plan -input=false -out=tfplan
          # Objects that exist but are missing from the state (a failed apply, a partial destroy) are adopted with
          # import blocks instead of failing the apply with "already exists"; the plan is then made again and
          # shows them as "will be imported"
          terraform show -json tfplan > tfplan.json
          python "$GITHUB_WORKSPACE/.github/scripts/tf_preflight.py" tfplan.json --adopt adopted_imports.tf
          if grep -q '^import' adopted_imports.tf; then
            cat adopted_imports.tf
            terraform plan -input=false -out=tfplan
          fi

      # terraform plan checks types, AWS checks values only during the apply (after other resources were created).
      # Ask AWS's read-only APIs the same questions now, before anyone approves the plan (.github/scripts/tf_preflight.py)
      - name: Preflight (AWS checks the apply would hit)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform show -json tfplan > tfplan.json
          python "$GITHUB_WORKSPACE/.github/scripts/tf_preflight.py" tfplan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-platform
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/adopted_imports.tf
          retention-days: 5

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: agripulse-infrastructure   # required reviewers: Settings > Environments
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-platform
          path: ${{ env.TF_DIR }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # A Helm release left FAILED by an earlier install blocks a new install ("cannot re-use a name that is still
      # in use"): it never worked, so it is uninstalled here, after approval, and the apply installs it again
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/infra-outputs
        with:
          stack: aws

      - name: Remove Helm releases left by a failed install
        working-directory: ${{ env.TF_DIR }}
        run: |
          python -m pip install --quiet pyyaml==6.0.3
          aws eks update-kubeconfig --name "$TF_OUT_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          terraform init -input=false
          terraform show -json tfplan > tfplan.json
          python "$GITHUB_WORKSPACE/.github/scripts/tf_preflight.py" tfplan.json --remove-failed-releases

      - name: terraform apply (the reviewed plan)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform apply -input=false tfplan
          {
            echo "### Platform applied in EKS"
            echo "- Argo CD: $(terraform output -raw argocd_url) (user admin; password: \`$(terraform output -raw argocd_password_command)\`)"
            echo "- Grafana: $(terraform output -raw grafana_url) (user admin; password: \`$(terraform output -raw grafana_password_command)\`)"
            echo "- Image signatures: $(terraform output -raw image_signature_mode)"
            echo "- Next (first deployment): run **web**, **incident-blog** and **mobile-backend**"
          } >> "$GITHUB_STEP_SUMMARY"

      # A Helm release whose pods never get ready fails with only "context deadline exceeded". Print WHY (pods
      # not ready, their container states and events, failed releases) at the end of the log, where the AI
      # diagnosis reads it.
      - name: Cluster state (only when the apply failed)
        if: failure()
        run: |
          aws eks update-kubeconfig --name "$TF_OUT_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          echo "Helm releases not deployed:"
          helm list -A --all -o json | jq -r '.[] | select(.status != "deployed") | "  \(.namespace)/\(.name): \(.status)"'
          echo "Pods not ready (container state, reason, message):"
          kubectl get pods -A -o json | jq -r '.items[]
            | select(.status.phase != "Succeeded")
            | select(([.status.containerStatuses[]?.ready] | all | not) or .status.phase == "Pending")
            | "  \(.metadata.namespace)/\(.metadata.name) \(.status.phase): " +
              ([.status.containerStatuses[]? | select(.ready | not)
                | "\(.name) \(.state | keys[0]) \(.state[].reason // "") \(.state[].message // "")"] | join("; "))' | head -20
          echo "Warning events (latest 25):"
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp -o custom-columns=NS:.metadata.namespace,OBJECT:.involvedObject.name,REASON:.reason,MESSAGE:.message --no-headers | tail -25

  diagnose:
    needs: [plan, apply]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ai-diagnosis
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
