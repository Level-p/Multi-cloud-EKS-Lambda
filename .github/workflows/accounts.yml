# AgriPulse accounts: sign-up and sign-in (one account for web and mobile) -> EKS, staging then production
# (Argo Rollouts canary with Prometheus analysis in both). Stages: _service.yml
name: accounts

on:
  push:
    branches: [main]
    paths:
      - "app/accounts/**"
      - "app/common/**"
      - "app/Dockerfile"
      - "app/dast/**"
      - "gitops/charts/agripulse-service/**"
      - "gitops/services/accounts/values.yaml"
      - ".github/workflows/accounts.yml"
      - ".github/workflows/_service.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths: ["app/accounts/**", "app/common/**", "app/Dockerfile", "app/dast/**", "gitops/charts/agripulse-service/**", "gitops/services/accounts/values.yaml"]
  workflow_dispatch:

permissions:
  contents: write   # the deploy jobs commit the new image to gitops/services/accounts/
  id-token: write   # OIDC token for AWS
  actions: read     # the AI diagnosis reads the failed jobs' logs
  checks: read

concurrency:
  group: accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    secrets: inherit
    with:
      service: accounts
