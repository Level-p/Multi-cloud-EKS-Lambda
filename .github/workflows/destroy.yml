# ---------------------------------------------------------------------------
# Tear down AgriPulse when you are done, in the reverse order of creation: platform -> aws.
#   Manual only (Actions > destroy > Run workflow), you type the confirmation phrase, and each job
#   waits for approval in the environment agripulse-infrastructure.
#
#   platform  the Argo CD apps are deleted (their pods and target group registrations go), then Tempo and Loki
#             with their EBS volumes (nothing is left billing outside the cluster); everything else in the
#             cluster is simply forgotten by Terraform: it goes with the cluster in the aws job
#   aws       EKS, VPC, NAT, RDS PostgreSQL (no final snapshot unless deletion_protection), ALB, the WAF and
#             the CloudFront distribution (images), API Gateway + Lambda, ECR, KMS keys (7-day deletion window),
#             the S3 media bucket and its files, Secrets Manager, EventBridge -> Slack, the DNS records
#
# Kept: what infra/bootstrap.sh made (the S3 state bucket, the GitHub Actions role) and the Route 53 zone.
# ---------------------------------------------------------------------------
name: destroy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to destroy ("everything" includes the platform)
        type: choice
        options: [everything, platform]
        default: everything
      confirm:
        description: Type "destroy agripulse" to confirm
        type: string
        required: true

permissions:
  contents: read
  id-token: write   # OIDC token for AWS

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.15.6
  TF_IN_AUTOMATION: "true"

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
        run: |
          [ "$CONFIRM" = "destroy agripulse" ] || { echo "::error::Type exactly: destroy agripulse"; exit 1; }
          echo "Destroying: $TARGET" >> "$GITHUB_STEP_SUMMARY"

  platform:
    needs: confirm
    runs-on: ubuntu-latest
    environment: agripulse-infrastructure   # required reviewers approve the destroy
    timeout-minutes: 45
    concurrency:
      group: platform                        # never at the same time as a platform apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Remove what would outlive the cluster, forget the rest
        working-directory: infra/platform
        # Safe to re-run: every clean-up command tolerates "already gone"; everything else fails the step
        run: |
          set -euo pipefail
          terraform init -input=false
          CLUSTER=$(aws eks list-clusters --query "clusters[?@=='agripulse-eks'] | [0]" --output text)
          if [ "$CLUSTER" = "agripulse-eks" ]; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
            # Argo CD apps (finalizer: their resources are pruned), then the releases that own EBS volumes
            if kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
              kubectl delete applications.argoproj.io -n argocd --all --wait=true --timeout=5m || true
            else
              echo "Argo CD is not installed: no applications to delete"
            fi
            for release in tempo loki; do
              if helm status "$release" -n monitoring >/dev/null 2>&1; then
                helm uninstall "$release" -n monitoring --wait --timeout 5m
              fi
            done
            kubectl delete pvc -n monitoring --all --wait=true --timeout=5m   # reclaimPolicy Delete: EBS volumes go
          else
            echo "No cluster: nothing inside it to clean up"
          fi
          # Forget the rest. One argument per address, never through xargs: it strips the quotes of for_each
          # keys (module.x.helm_release.this["argocd"] -> this[argocd], "Index value required")
          addresses=$(terraform state list)
          if [ -n "$addresses" ]; then
            mapfile -t inside <<< "$addresses"
            terraform state rm "${inside[@]}"
          fi
          left=$(terraform state list)
          [ -z "$left" ] || { echo "::error::Still in the platform state:"; echo "$left"; exit 1; }
          echo "### Platform removed (in-cluster state forgotten; EBS volumes deleted)" >> "$GITHUB_STEP_SUMMARY"

  aws:
    needs: platform
    if: inputs.target == 'everything'
    runs-on: ubuntu-latest
    environment: agripulse-infrastructure
    timeout-minutes: 120
    permissions:
      contents: write   # the image reset commit below
      id-token: write
    concurrency:
      group: infra-aws
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform destroy (AWS)
        working-directory: infra/aws
        env:
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}   # a required variable of infra/aws
        run: |
          terraform init -input=false
          # deletion_protection = true (RDS, ALB, images, media files kept) makes this fail on purpose
          terraform destroy -input=false -auto-approve
          {
            echo "### AWS destroyed"
            echo "- Kept: the Terraform state bucket, the GitHub Actions IAM role and the Route 53 zone"
            echo "- The KMS keys are pending deletion for 7 days (no cost while pending)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ECR and every image in it are gone: Git must not keep pointing at them. Otherwise the next environment's
      # Argo CD deploys those missing images first, Argo Rollouts takes that never-running version as "stable", and
      # every later canary waits forever for it. Back to the placeholder, the chart then shows "No <service> image
      # has been built yet" until each pipeline runs.
      - name: Reset the GitOps image references to the placeholder
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --ff-only origin main
            for f in gitops/services/*/staging.yaml gitops/services/*/production.yaml; do
              yq -i '.image.tag = "initial" | del(.image.digest)' "$f"
            done
            git commit -am "ci: images deleted with the environment, back to the placeholder [skip ci]" || { echo "already reset"; exit 0; }
            git push origin HEAD:main && { echo "- GitOps image references reset to the placeholder" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            git reset --hard origin/main
          done
          echo "::error::Could not push the image reset"; exit 1
