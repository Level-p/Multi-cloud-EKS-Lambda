# AgriPulse incident-response blog -> EKS (namespace incident-response). Stages: _container-app.yml
name: incident-blog

on:
  push:
    branches: [main]
    paths:
      - "app/incident-blog/**"
      - "gitops/charts/incident-blog/**"
      - "app/dast/**"
      - ".github/workflows/incident-blog.yml"
      - ".github/workflows/_container-app.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths: ["app/incident-blog/**", "gitops/charts/incident-blog/**", "app/dast/**"]
  workflow_dispatch:

permissions:
  contents: write   # the gitops job commits the new image tag
  id-token: write   # OIDC token for AWS
  actions: read     # the AI diagnosis reads the failed jobs' logs
  checks: read

concurrency:
  group: incident-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/_container-app.yml
    secrets: inherit
    with:
      app: incident-blog
      chart: gitops/charts/incident-blog
      workload: deployment/incident-blog
      namespace: incident-response
      url-env: TF_OUT_INCIDENT_BLOG_URL
