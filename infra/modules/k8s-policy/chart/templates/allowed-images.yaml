# Every container of a pod in the app namespaces comes from our ECR (agripulse/*) or is one of the exact digests of
# Valkey and redis_exporter. Anything else is rejected.
{{- if not .Values.registry }}{{ fail "registry is required" }}{{ end }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: agripulse-allowed-images
spec:
  validationActions: [Deny]
  matchConstraints:
    {{- include "policies.match" . | nindent 4 }}
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
    - name: pinned
      expression: {{ printf "[%s]" (include "policies.cel-strings" .Values.pinnedImages) | quote }}
  validations:
    - expression: >-
        variables.images.all(i,
          i.startsWith({{ printf "'%s/agripulse/'" .Values.registry }})
          || i in variables.pinned)
      messageExpression: >-
        'image not allowed in this namespace: ' + variables.images.filter(i,
          !(i.startsWith({{ printf "'%s/agripulse/'" .Values.registry }})
          || i in variables.pinned)).join(', ')
      reason: Forbidden
{{- define "policies.cel-strings" -}}
{{- $out := list -}}
{{- range . }}{{ $out = append $out (printf "'%s'" .) }}{{ end -}}
{{- join ", " $out -}}
{{- end }}
