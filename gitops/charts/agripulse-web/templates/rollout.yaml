# Progressive delivery with automated analysis (the AIOps deployment gate):
# a new image first runs in a quarter of the pods; the success rate and p95 latency of
# the CANARY pods (Prometheus) decide whether the rollout continues or aborts and rolls back.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agripulse-web
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rollout.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: agripulse-web }
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 2m }
        - analysis:
            templates: [{ templateName: canary-health }]
            args:
              - name: canary-hash
                valueFrom: { podTemplateHashValue: Latest }
        - setWeight: 50
        - pause: { duration: 2m }
        - analysis:
            templates: [{ templateName: canary-health }]
            args:
              - name: canary-hash
                valueFrom: { podTemplateHashValue: Latest }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agripulse-web
        {{- include "web.labels" . | nindent 8 }}
    spec:
      serviceAccountName: agripulse-web
      securityContext: {{- include "web.podSecurity" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: agripulse-web } }
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "web.dbEnv" . | nindent 12 }}
            - { name: REDIS_HOST, value: agripulse-redis }        # the in-cluster Valkey Service
            - { name: REDIS_PORT, value: "6379" }
            - { name: PRICE_ADMINS, value: {{ .Values.priceAdmins | quote }} }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: agripulse-redis, key: password } }
            - name: CSRF_SECRET
              valueFrom: { secretKeyRef: { name: agripulse-web-secrets, key: csrf-secret } }
            {{- with .Values.telemetry.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ . | quote }} }
            - { name: OTEL_SERVICE_NAME, value: agripulse-web }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=agripulse,deployment.environment.name=production,service.version={{ $.Values.image.tag }}" }
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ $.Values.telemetry.samplingRatio | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "web.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "web.secretsVolume" . | nindent 8 }}
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-health
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      failureLimit: 1
      # No traffic yet = no result = not a failure
      successCondition: "len(result) == 0 || result[0] >= {{ .Values.rollout.successRateThreshold }}"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}", status!~"5.."}[2m]))
            / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[2m]))
    - name: latency-p95
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: "len(result) == 0 || result[0] <= {{ .Values.rollout.latencyP95Seconds }}"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[2m])))
---
apiVersion: v1
kind: Service
metadata:
  name: agripulse-web
  labels:
    app.kubernetes.io/name: agripulse-web
    {{- include "web.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: agripulse-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agripulse-web
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: agripulse-web } }
