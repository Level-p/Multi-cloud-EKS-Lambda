# Redis cache inside the EKS cluster: Valkey (the open-source Redis fork).
# It is a CACHE in front of PostgreSQL (the only database): nothing in it is the source of truth,
# so it keeps data in memory only (no disk) and evicts the least recently used keys when full.
# If it restarts, the web app reads from SQL and refills it (cache-aside, see app/web/app/cache.py).
# The password Secret "agripulse-redis" is created by Terraform (infra/platform/main.tf).
{{- $r := .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agripulse-redis
  labels:
    app.kubernetes.io/name: agripulse-redis
    app.kubernetes.io/component: cache
    {{- include "web.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: agripulse-redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agripulse-redis
        app.kubernetes.io/component: cache
        {{- include "web.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # "valkey" user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: {{ $r.image | quote }}
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: agripulse-redis, key: password } }
          args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --maxmemory
            - {{ $r.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru          # a cache: drop the least recently used keys when full
            - --save
            - ""                   # no snapshots: memory only
            - --appendonly
            - "no"
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          livenessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml $r.resources | nindent 12 }}
          securityContext: {{- include "web.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
        - name: exporter
          image: {{ $r.exporterImage | quote }}
          env:
            - { name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: agripulse-redis, key: password } }
          ports: [{ name: metrics, containerPort: 9121 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: {{- include "web.containerSecurity" . | nindent 12 }}
      volumes:
        - { name: data, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: agripulse-redis
  labels:
    app.kubernetes.io/name: agripulse-redis
    {{- include "web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agripulse-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    - { name: metrics, port: 9121, targetPort: metrics }
---
# Only the web pods may talk to the cache, and only Prometheus may read its metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-web-and-prometheus
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agripulse-redis } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agripulse-web } } }]
      ports: [{ port: 6379, protocol: TCP }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9121, protocol: TCP }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agripulse-redis
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agripulse-redis } }
  endpoints: [{ port: metrics, interval: 30s }]
