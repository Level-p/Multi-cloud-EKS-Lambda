# Creates the three PostgreSQL databases and their IAM-authenticated users before every sync (idempotent):
# agripulse (web app), incidents (incident blog), mobile (the mobile API Lambda); app/web/app/sql_bootstrap.py.
# It is the only workload that reads the RDS master password (Secrets Manager, through this ServiceAccount's
# EKS Pod Identity role); the apps themselves sign in with IAM tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sql-bootstrap
  annotations:
    # A hook too, in an earlier wave: it must exist before the Job below on the very first sync
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sql-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql-bootstrap
    spec:
      serviceAccountName: sql-bootstrap
      restartPolicy: Never
      securityContext: {{- include "web.podSecurity" . | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "app.sql_bootstrap"]
          env:
            - { name: DB_HOST, value: {{ .Values.db.host | quote }} }
            - { name: DB_PORT, value: {{ .Values.db.port | toString | quote }} }
            - { name: AWS_REGION, value: {{ .Values.aws.region | quote }} }
            - { name: MASTER_SECRET_ID, value: {{ .Values.db.masterSecretId | quote }} }
            - { name: DB_USERS, value: {{ .Values.db.users | toJson | quote }} }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: {{- include "web.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
