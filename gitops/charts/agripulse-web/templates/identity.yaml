# EKS Pod Identity association (infra/aws/main.tf) for this ServiceAccount: read <prefix>/web/* and <prefix>/shared/*
# in Secrets Manager, and rds-db:connect as the web app's PostgreSQL user (no database password)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agripulse-web
  labels: {{- include "web.labels" . | nindent 4 }}
---
# Secrets Manager -> files in the pod and the Kubernetes Secret "agripulse-web-secrets"
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agripulse-web-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: {{ .Values.aws.region | quote }}
    objects: |
      - objectName: "{{ .Values.aws.secretPrefix }}/web/csrf-secret"
        objectType: secretsmanager
        objectAlias: csrf-secret
      - objectName: "{{ .Values.aws.secretPrefix }}/web/cookie-secret"
        objectType: secretsmanager
        objectAlias: cookie-secret
      - objectName: "{{ .Values.aws.secretPrefix }}/shared/oauth2-client-secret"
        objectType: secretsmanager
        objectAlias: oauth2-client-secret
  secretObjects:
    - secretName: agripulse-web-secrets
      type: Opaque
      data:
        - { objectName: csrf-secret, key: csrf-secret }
        - { objectName: oauth2-client-secret, key: oauth2-client-secret }
        - { objectName: cookie-secret, key: cookie-secret }
