# Redis cache inside the EKS cluster (redis.enabled, e.g. the shop): Valkey, the open-source Redis fork, in this
# service's own namespace. A CACHE (catalog) and the carts: memory only (no disk), least recently used keys evicted
# when full. If it restarts, the service reads from its sources again (cache-aside, app/common/agripulse_common/cache.py).
# The password Secret "<service>-redis" is created by Terraform (infra/modules/k8s-gitops).
{{- if .Values.redis.enabled }}
{{- $name := include "svc.name" . }}
{{- $r := .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-redis
  labels:
    app.kubernetes.io/name: {{ $name }}-redis
    app.kubernetes.io/component: cache
    {{- include "svc.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}-redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-redis
        app.kubernetes.io/component: cache
        {{- include "svc.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # "valkey" user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: {{ $r.image | quote }}
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}-redis, key: password } }
          args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --maxmemory
            - {{ $r.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru          # a cache: drop the least recently used keys when full
            - --save
            - ""                   # no snapshots: memory only
            - --appendonly
            - "no"
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          livenessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml $r.resources | nindent 12 }}
          securityContext: {{- include "svc.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
        - name: exporter
          image: {{ $r.exporterImage | quote }}
          env:
            - { name: REDIS_ADDR, value: "redis://127.0.0.1:6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}-redis, key: password } }
          ports: [{ name: metrics, containerPort: 9121 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: {{- include "svc.containerSecurity" . | nindent 12 }}
      volumes:
        - { name: data, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-redis
  labels:
    app.kubernetes.io/name: {{ $name }}-redis
    {{- include "svc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }}-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    - { name: metrics, port: 9121, targetPort: metrics }
---
# Only this service's pods may talk to the cache, and only Prometheus may read its metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-{{ $name }}-and-prometheus
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }}-redis } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } } }]
      ports: [{ port: 6379, protocol: TCP }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9121, protocol: TCP }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}-redis
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}-redis } }
  endpoints: [{ port: metrics, interval: 30s }]
{{- end }}
