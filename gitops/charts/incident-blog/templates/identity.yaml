# EKS Pod Identity association (infra/aws/main.tf) for this ServiceAccount: read <prefix>/incidents/* and
# <prefix>/shared/* in Secrets Manager, and rds-db:connect as the blog's PostgreSQL user (no database password)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-blog
  labels: {{- include "blog.labels" . | nindent 4 }}
---
# Secrets Manager -> files in the pod and the Kubernetes Secret "incident-blog-secrets"
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: incident-blog-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: {{ .Values.aws.region | quote }}
    objects: |
      - objectName: "{{ .Values.aws.secretPrefix }}/incidents/csrf-secret"
        objectType: secretsmanager
        objectAlias: csrf-secret
      - objectName: "{{ .Values.aws.secretPrefix }}/incidents/webhook-token"
        objectType: secretsmanager
        objectAlias: webhook-token
      - objectName: "{{ .Values.aws.secretPrefix }}/incidents/cookie-secret"
        objectType: secretsmanager
        objectAlias: cookie-secret
      - objectName: "{{ .Values.aws.secretPrefix }}/shared/oauth2-client-secret"
        objectType: secretsmanager
        objectAlias: oauth2-client-secret
  secretObjects:
    - secretName: incident-blog-secrets
      type: Opaque
      data:
        - { objectName: csrf-secret, key: csrf-secret }
        - { objectName: webhook-token, key: webhook-token }
        - { objectName: oauth2-client-secret, key: oauth2-client-secret }
        - { objectName: cookie-secret, key: cookie-secret }
