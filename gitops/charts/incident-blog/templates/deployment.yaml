apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-blog
  labels: {{- include "blog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: incident-blog } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-blog
        {{- include "blog.labels" . | nindent 8 }}
    spec:
      serviceAccountName: incident-blog
      securityContext: {{- include "blog.podSecurity" . | nindent 8 }}
      containers:
        - name: incident-blog
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "blog.dbEnv" . | nindent 12 }}
            - name: CSRF_SECRET
              valueFrom: { secretKeyRef: { name: incident-blog-secrets, key: csrf-secret } }
            - name: WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: incident-blog-secrets, key: webhook-token } }
            {{- with .Values.telemetry.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ . | quote }} }
            - { name: OTEL_SERVICE_NAME, value: incident-blog }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=agripulse,deployment.environment.name=production,service.version={{ $.Values.image.tag }}" }
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ $.Values.telemetry.samplingRatio | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "blog.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "blog.secretsVolume" . | nindent 8 }}
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: incident-blog
  labels:
    app.kubernetes.io/name: incident-blog
    {{- include "blog.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: incident-blog }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incident-blog
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: incident-blog } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: incident-blog
  labels: {{- include "blog.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: incident-blog } }
  endpoints: [{ port: http, path: /metrics, interval: 30s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: incident-blog
spec:
  groups:
    - name: incident-response
      rules:
        # A SEV1 that nobody has triaged after 15 minutes is itself an incident
        - alert: Sev1NotTriaged
          expr: max(incidents_untriaged{namespace="{{ .Release.Namespace }}", severity="SEV1"}) > 0
          for: 15m
          labels: { severity: critical, namespace: {{ .Release.Namespace }} }
          annotations: { summary: "An open SEV1 incident has been waiting for 15 minutes: page the incident commander" }
